<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LitWalk – Global Student Nightlife & Safety Radar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-dark: #0b0f19;
      --glass-bg: rgba(15, 23, 42, 0.85);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --primary: #38bdf8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-primary); height: 100vh; overflow: hidden; }

    #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    /* Top HUD / Controls */
    .top-controls {
      position: absolute; top: 16px; left: 16px; right: 16px; z-index: 1000;
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px;
      scrollbar-width: none;
    }
    .top-controls::-webkit-scrollbar { display: none; }

    .filter-btn, .action-btn {
      background: var(--glass-bg);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border); color: var(--text-primary);
      padding: 10px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
      white-space: nowrap; cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; gap: 6px;
    }
    .filter-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
    .action-btn.transit-btn { background: rgba(56, 189, 248, 0.2); border-color: var(--primary); color: var(--primary); }

    /* Transit Hacks Drawer */
    .drawer {
      position: absolute; bottom: -100%; left: 0; right: 0; max-height: 70vh;
      background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--glass-border); border-radius: 20px 20px 0 0;
      padding: 20px; z-index: 2000; transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto; color: var(--text-primary);
    }
    .drawer.open { bottom: 0; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .drawer-header h2 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .close-btn { background: none; border: none; color: var(--text-secondary); font-size: 24px; cursor: pointer; }

    .hack-card {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 14px; margin-bottom: 12px;
    }
    .hack-card h3 { font-size: 14px; margin-bottom: 6px; color: var(--primary); }
    .hack-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.4; }

    /* Custom Map Popup Styling */
    .leaflet-popup-content-wrapper {
      background: var(--glass-bg) !important; backdrop-filter: blur(12px);
      color: var(--text-primary) !important; border: 1px solid var(--glass-border);
      border-radius: 12px; font-size: 13px;
    }
    .leaflet-popup-tip { background: var(--glass-bg) !important; }
    .popup-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
    .popup-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-bottom: 6px; background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>

  <div class="top-controls">
    <button class="action-btn transit-btn" onclick="toggleDrawer()">🚌 Transit Hacks</button>
    <button class="filter-btn active" onclick="filterMarkers('all')">📍 All</button>
    <button class="filter-btn" onclick="filterMarkers('bars')">🍺 Bars</button>
    <button class="filter-btn" onclick="filterMarkers('eats')">🍕 Cheap Eats</button>
    <button class="filter-btn" onclick="filterMarkers('gems')">🎨 Gems</button>
    <button class="filter-btn" onclick="filterMarkers('wifi')">💻 Wi-Fi</button>
    <button class="filter-btn" onclick="filterMarkers('water')">💧 Water</button>
    <button class="filter-btn" onclick="filterMarkers('scam')">⚠️ Scam Zones</button>
  </div>

  <div id="drawer" class="drawer">
    <div class="drawer-header">
      <h2 id="drawer-title">🚌 Transit Hacks</h2>
      <button class="close-btn" onclick="toggleDrawer()">&times;</button>
    </div>
    <div id="drawer-content">Loading...</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, cityData, markers = [];

    async function init() {
      map = L.map('map', { zoomControl: false }).setView([51.5134, -0.13], 13);
      
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 19
      }).addTo(map);

      try {
        const res = await fetch('cities-data.json');
        const data = await res.json();
        cityData = data.london;
        
        renderMarkers('all');
        renderTransitHacks();
      } catch (err) {
        console.error("Failed to load cities-data.json", err);
      }
    }

    function createIcon(emoji, color) {
      return L.divIcon({
        html: `<div style="background:${color}; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 0 10px ${color}; font-size:16px;">${emoji}</div>`,
        className: '', iconSize: [32, 32], iconAnchor: [16, 16]
      });
    }

    function renderMarkers(category) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const config = {
        bars: { key: 'bars', emoji: '🍺', color: '#f59e0b' },
        eats: { key: 'eats', emoji: '🍕', color: '#10b981' },
        gems: { key: 'gems', emoji: '🎨', color: '#38bdf8' },
        wifi: { key: 'wifi', emoji: '💻', color: '#8b5cf6' },
        water: { key: 'water', emoji: '💧', color: '#06b6d4' },
        scam: { key: 'scam', emoji: '⚠️', color: '#ef4444' }
      };

      Object.keys(config).forEach(cat => {
        if (category === 'all' || category === cat) {
          const cfg = config[cat];
          (cityData[cfg.key] || []).forEach(item => {
            const marker = L.marker([item.lat, item.lon], { icon: createIcon(cfg.emoji, cfg.color) });
            
            let popupContent = `<div class="popup-title">${item.name || item.title}</div>`;
            if (item.price) popupContent += `<span class="popup-badge">${item.price}</span>`;
            if (item.deal) popupContent += `<p>${item.deal}</p>`;
            if (item.desc) popupContent += `<p>${item.desc}</p>`;
            
            marker.bindPopup(popupContent);
            marker.addTo(map);
            markers.push(marker);
          });
        }
      });
    }

    function filterMarkers(cat) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderMarkers(cat);
    }

    function renderTransitHacks() {
      const container = document.getElementById('drawer-content');
      container.innerHTML = cityData.transitHacks.map(h => `
        <div class="hack-card">
          <h3>${h.title}</h3>
          <p>${h.desc}</p>
        </div>
      `).join('');
    }

    function toggleDrawer() {
      document.getElementById('drawer').classList.toggle('open');
    }

    window.onload = init;
  </script>
</body>
</html>
